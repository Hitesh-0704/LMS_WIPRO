<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Messages — LMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .message-card {
          background: #fff;
          border: 1px solid #e5e7eb;
          border-radius: 12px;
          padding: 20px 24px;
          margin-bottom: 16px;
          transition: box-shadow 0.2s;
        }
        .message-card.unread { border-left: 4px solid #000; }
        .message-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        .msg-header {
          display: flex; justify-content: space-between;
          align-items: flex-start; margin-bottom: 10px;
        }
        .msg-sender { font-weight: 700; font-size: 16px; color: #111; }
        .msg-email  { font-size: 13px; color: #6b7280; margin-top: 2px; }
        .msg-phone  { font-size: 13px; color: #6b7280; margin-top: 2px; }
        .msg-date   { font-size: 12px; color: #9ca3af; white-space: nowrap; }
        .msg-body {
          font-size: 14px; color: #374151;
          background: #f9fafb; border-radius: 8px;
          padding: 12px 16px; margin: 12px 0;
          line-height: 1.6; word-break: break-word;
        }
        .msg-actions { display: flex; gap: 10px; align-items: center; }
        .badge-unread {
          display: inline-block; background: #f3f4f6;
          color: #111; font-size: 11px; font-weight: 700;
          padding: 3px 10px; border-radius: 20px;
        }
        .badge-read {
          display: inline-block; background: #f3f4f6;
          color: #6b7280; font-size: 11px; font-weight: 700;
          padding: 3px 10px; border-radius: 20px;
        }
        .unread-count {
          display: inline-block; background: #111; color: #fff;
          font-size: 12px; font-weight: 700;
          padding: 2px 10px; border-radius: 20px; margin-left: 8px;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <span class="brand">LMS <span>Platform</span></span>
    <div class="nav-links">
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/students}">Students</a>
        <a th:href="@{/admin/courses}">Courses</a>
        <a th:href="@{/admin/users}">Users</a>
        <a th:href="@{/admin/messages}">Messages</a>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button class="logout-btn" type="submit">Logout</button>
        </form>
    </div>
</nav>

<div class="page">

    <div class="page-title">
        Contact Messages
        <span th:if="${unreadCount > 0}"
              class="unread-count"
              th:text="${unreadCount} + ' unread'"></span>
    </div>
    <div class="page-subtitle">
        Messages submitted by students via the Contact Us form.
    </div>

    <div class="box">
        <div class="box-title">All Messages</div>

        <div th:if="${#lists.isEmpty(messages)}" class="empty">
            No messages yet.
        </div>

        <div th:unless="${#lists.isEmpty(messages)}">
            <div th:each="m : ${messages}"
                 th:class="${!m.isRead} ? 'message-card unread' : 'message-card'">

                <div class="msg-header">
                    <div>
                        <div class="msg-sender" th:text="${m.name}"></div>
                        <div class="msg-email">✉️ <span th:text="${m.email}"></span></div>
                        <div class="msg-phone">📞 <span th:text="${m.phone}"></span></div>
                    </div>
                    <div style="text-align:right;">
                        <div class="msg-date"
                             th:text="${#temporals.format(m.createdAt, 'dd MMM yyyy, hh:mm a')}"></div>
                        <div style="margin-top:6px;">
                            <span th:if="${m.isRead}"   class="badge-read">✓ Read</span>
                            <span th:unless="${m.isRead}" class="badge-unread">● Unread</span>
                        </div>
                    </div>
                </div>

                <div class="msg-body" th:text="${m.message}"></div>

                <div class="msg-actions">
                    <a th:unless="${m.isRead}"
                       th:href="@{'/admin/messages/' + ${m.id} + '/read'}"
                       class="btn btn-sm btn-edit">
                        ✓ Mark as Read
                    </a>
                    <a th:href="@{'/admin/messages/' + ${m.id} + '/delete'}"
                       class="btn btn-sm btn-danger"
                       onclick="return confirm('Delete this message?')">
                        🗑 Delete
                    </a>
                </div>

            </div>
        </div>
    </div>

</div>
</body>
</html>
