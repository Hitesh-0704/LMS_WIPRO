<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register — LMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="login-page">
    <div class="login-box">

        <h1>LMS <span style="color:var(--accent);">Platform</span></h1>
        <p class="subtitle">Create a student account</p>

        <form th:action="@{/register}" th:object="${student}" method="post">

            <div class="field">
                <label for="name">Full name</label>
                <input type="text" id="name" th:field="*{name}"
                       placeholder="Your full name" required>
                <span class="field-error"
                      th:if="${#fields.hasErrors('name')}"
                      th:errors="*{name}"></span>
            </div>

            <div class="field">
                <label for="email">Email <span style="font-weight:400;">(used as username)</span></label>
                <input type="email" id="email" th:field="*{email}"
                       placeholder="you@email.com" required>
                <span class="field-error"
                      th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}"></span>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Choose a password (min 4 chars)" required>
                <span class="field-error"
                      th:if="${passwordError}"
                      th:text="${passwordError}"></span>
            </div>

            <button type="submit" class="btn btn-primary">Register</button>

        </form>

        <p style="text-align:center; margin-top:16px; font-size:14px; color:var(--muted);">
            Already have an account? <a th:href="@{/login}">Sign in</a>
        </p>

    </div>
</div>

</body>
</html>
