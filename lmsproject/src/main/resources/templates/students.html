<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Students — LMS Admin</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 999;
      align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #fff; border-radius: 16px; padding: 40px;
      width: 100%; max-width: 500px; max-height: 90vh;
      overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .modal h2 { margin: 0 0 24px; font-size: 22px; }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: 13px;
      font-weight: 600; margin-bottom: 6px; color: #444;
    }
    .form-group input, .form-group select {
      width: 100%; padding: 10px 14px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 14px; box-sizing: border-box;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: #000; }
    .hint { font-size: 11px; color: #999; font-weight: normal; }
    .btn-row { display: flex; gap: 12px; margin-top: 20px; }
    .btn-save {
      flex: 1; background: #000; color: #fff; border: none;
      padding: 11px; border-radius: 8px; font-weight: 600;
      cursor: pointer; font-size: 14px;
    }
    .btn-save:hover { background: #333; }
    .btn-cancel {
      flex: 1; background: #fff; color: #333;
      border: 1px solid #ddd; padding: 11px; border-radius: 8px;
      font-weight: 600; cursor: pointer; font-size: 14px;
    }
    .btn-cancel:hover { background: #f5f5f5; }
    .tag {
      display: inline-block; font-size: 11px; padding: 3px 10px;
      border-radius: 20px; font-weight: 600; margin: 2px;
    }
    .tag-blue { background: #dbeafe; color: #1d4ed8; }
    .tag-green { background: #dcfce7; color: #16a34a; }
    .edit-btn {
      font-size: 12px; padding: 5px 12px; border-radius: 6px;
      background: #f3f4f6; border: none; cursor: pointer; font-weight: 500;
    }
    .edit-btn:hover { background: #e5e7eb; }
    .alert-success {
      background: #dcfce7; color: #16a34a; padding: 12px 16px;
      border-radius: 8px; margin-bottom: 20px; font-size: 14px;
    }
    .alert-error {
      background: #fee2e2; color: #dc2626; padding: 12px 16px;
      border-radius: 8px; margin-bottom: 20px; font-size: 14px;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <span class="brand">LMS <span>Platform</span></span>
  <div class="nav-links">
    <a th:href="@{/admin/dashboard}">Dashboard</a>
    <a th:href="@{/admin/students}">Students</a>
    <a th:href="@{/admin/courses}">Courses</a>
    <a th:href="@{/admin/users}">Users</a>
    <a th:href="@{/admin/messages}">Messages</a>
    <form th:action="@{/logout}" method="post" style="display:inline">
      <button class="logout-btn" type="submit">Logout</button>
    </form>
  </div>
</nav>

<div class="page">

  <div class="page-title">Students</div>
  <div class="page-subtitle">Manage all registered students and their enrollments.</div>

  <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>
  <div th:if="${errorMessage}"   class="alert-error"   th:text="${errorMessage}"></div>

  <div class="box">
    <div class="box-title">All Students</div>

    <div th:if="${#lists.isEmpty(students)}" class="empty">
      No students registered yet.
    </div>

    <div class="table-wrap" th:unless="${#lists.isEmpty(students)}">

      <!-- Hidden enrollment data for JS — one div per student -->
      <div style="display:none">
        <div th:each="student : ${students}"
             th:id="'enrollments-' + ${student.id}">
          <span th:each="e : ${enrollmentMap[student.id]}"
                th:attr="data-enrollment-id=${e.enrollmentId},
                         data-title=${e.courseTitle},
                         data-completed=${e.completed}">
          </span>
        </div>
      </div>

      <table>
        <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Enrolled Courses</th>
          <th>Progress</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
          <td th:text="${student.name}"></td>
          <td style="color:#6b7280" th:text="${student.email}"></td>
          <td>
            <th:block th:with="courses=${enrollmentMap[student.id]}">
                <span th:if="${#lists.isEmpty(courses)}"
                      style="color:#9ca3af; font-size:13px;">None</span>
              <th:block th:each="enrollment : ${courses}">
                  <span th:class="${enrollment.completed} ? 'tag tag-green' : 'tag tag-blue'"
                        th:text="${enrollment.courseTitle}"></span>
              </th:block>
            </th:block>
          </td>
          <td>
            <th:block th:with="courses=${enrollmentMap[student.id]}">
                <span th:if="${!#lists.isEmpty(courses)}"
                      style="font-size:13px; color:#6b7280">
                  <span th:text="${#lists.size(courses.?[completed])}"></span>/<span
                        th:text="${#lists.size(courses)}"></span> done
                </span>
              <span th:if="${#lists.isEmpty(courses)}" style="color:#9ca3af">—</span>
            </th:block>
          </td>
          <td>
            <button class="edit-btn"
                    th:attr="data-id=${student.id},
                               data-name=${student.name},
                               data-email=${student.email}"
                    onclick="openEditModal(this)">
              ✏️ Edit
            </button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h2>Edit Student</h2>

    <form th:action="@{/admin/students/edit}" method="post">
      <input type="hidden" name="studentId" id="editStudentId">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" id="editName" required>
      </div>

      <div class="form-group">
        <label>Email / Username</label>
        <input type="email" name="email" id="editEmail" required>
      </div>

      <div class="form-group">
        <label>New Password <span class="hint">(leave blank to keep current)</span></label>
        <input type="password" name="newPassword"
               placeholder="Enter new password or leave blank">
      </div>

      <div class="form-group">
        <label>Remove Enrollment <span class="hint">(optional)</span></label>
        <select name="removeEnrollmentId" id="editRemoveEnrollment">
          <option value="">— Don't remove any —</option>
        </select>
      </div>

      <div class="form-group">
        <label>Enroll in New Course <span class="hint">(optional)</span></label>
        <select name="newCourseId">
          <option value="">— No change —</option>
          <option th:each="course : ${allCourses}"
                  th:value="${course.id}"
                  th:text="${course.title}"></option>
        </select>
      </div>

      <div class="btn-row">
        <button type="submit" class="btn-save">Save Changes</button>
        <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
  function openEditModal(btn) {
    const id    = btn.getAttribute('data-id');
    const name  = btn.getAttribute('data-name');
    const email = btn.getAttribute('data-email');

    document.getElementById('editStudentId').value = id;
    document.getElementById('editName').value       = name;
    document.getElementById('editEmail').value      = email;

    // Populate remove enrollment dropdown from hidden data
    const select = document.getElementById('editRemoveEnrollment');
    select.innerHTML = '<option value="">— Don\'t remove any —</option>';

    const container = document.getElementById('enrollments-' + id);
    if (container) {
      container.querySelectorAll('[data-enrollment-id]').forEach(function(item) {
        const opt = document.createElement('option');
        opt.value = item.getAttribute('data-enrollment-id');
        const completed = item.getAttribute('data-completed') === 'true';
        opt.textContent = item.getAttribute('data-title') + (completed ? ' (completed)' : '');
        select.appendChild(opt);
      });
    }

    document.getElementById('editModal').classList.add('active');
  }

  function closeEditModal() {
    document.getElementById('editModal').classList.remove('active');
  }

  document.getElementById('editModal').addEventListener('click', function(e) {
    if (e.target === this) closeEditModal();
  });
</script>

</body>
</html>
